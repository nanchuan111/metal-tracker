<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金属立方体高精度追踪与加速度计</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 55vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 45vh; padding: 15px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #00ffff; }
        .data-box { font-size: 32px; font-weight: bold; color: #00ffff; margin: 8px 0; }
        .sub-data { font-size: 16px; color: #aaa; margin-bottom: 10px; }
        button { padding: 12px 25px; font-size: 18px; background: #00ffff; color: #000; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; }
        .slider-container { margin: 8px auto; width: 85%; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        input[type=range] { width: 60%; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>

    <div id="loading">正在加载OpenCV.js视觉引擎，请稍候...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none;">开始高精度追踪</button>
        <div id="controls" style="display:none;">
            <div class="slider-container">
                <label>边缘检测门限:</label>
                <input type="range" id="thresholdSlider" min="10" max="150" value="70">
                <span id="sliderVal">70</span>
            </div>
            <div class="data-box">实时加速度: <span id="accel-val">0.00</span> m/s²</div>
            <div class="sub-data">当前速度: <span id="speed-val">0.00</span> m/s</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const sliderVal = document.getElementById('sliderVal');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');

        // --- 【核心物理参数配置】 ---
        // 假设手机距离物体 20cm，且立方体边长约为 1cm (0.01米)
        // 1米在此场景下约为 3200 像素
        const PX_PER_METER = 3200; 
        
        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let isTracking = false;
        let cannyThreshold = 70; // 默认边缘门限，针对黑色背景优化

        // 0.5秒定时显示缓存
        let currentRealSpeed = 0;
        let currentRealAccel = 0;
        let lastDisplayTime = performance.now();

        // OpenCV 内存变量容器
        let src, gray, blurred, edges, contours, hierarchy;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        thresholdSlider.addEventListener('input', (e) => {
            cannyThreshold = parseInt(e.target.value);
            sliderVal.innerText = cannyThreshold;
        });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // 初始化 OpenCV 矩阵容器
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    blurred = new cv.Mat();
                    edges = new cv.Mat();
                    contours = new cv.MatVector();
                    hierarchy = new cv.Mat();
                    
                    isTracking = true;
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                alert("无法获取相机权限: " + err.message);
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            // 1. 抓取当前视频帧
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            // 2. OpenCV 图像高级管道处理 (消除反光干扰)
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);                       // 灰度化
            cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT); // 高斯模糊去噪
            cv.Canny(blurred, edges, cannyThreshold, cannyThreshold * 2);     //提取金属轮廓边缘
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE); //提取独立轮廓

            let bestCenter = null;
            let maxArea = 0;

            // 3. 寻找画面中大小最像立方体的轮廓
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                
                // 限制轮廓大小，过滤过大(背景)或过小(噪点)的区域 (在20cm距离下，立方体轮廓面积通常在 150~5000 像素之间)
                if (area > 150 && area < 6000) {
                    if (area > maxArea) {
                        maxArea = area;
                        // 通过一阶矩计算质心
                        let M = cv.moments(cnt, false);
                        if (M.m00 !== 0) {
                            bestCenter = { x: M.m10 / M.m00, y: M.m01 / M.m00 };
                        }
                    }
                }
            }

            const currentTime = performance.now();
            const dt = (currentTime - lastTime) / 1000; // 秒

            // 4. 高精度物理运动学计算 (质心追踪)
            if (bestCenter && dt > 0) {
                // 在前端画布上画一个亮青色的高科技准星 (双环+十字)
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 18, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 4, 0, 2 * Math.PI);
                ctx.fill();

                if (lastPos) {
                    const dx = bestCenter.x - lastPos.x;
                    const dy = bestCenter.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    const distanceMeters = distancePx / PX_PER_METER;
                    const velocityMetersPerSec = distanceMeters / dt;
                    const accelMetersPerSec2 = (velocityMetersPerSec - lastVelocity) / dt;

                    // 5. 极其严格的一阶低通滤波：专治手抖
                    currentRealSpeed = velocityMetersPerSec * 0.25 + currentRealSpeed * 0.75;
                    
                    let rawAccel = Math.abs(accelMetersPerSec2);
                    // 设立 0.15 m/s² 的抖动死区
                    if (rawAccel < 0.15) rawAccel = 0; 
                    currentRealAccel = rawAccel * 0.15 + currentRealAccel * 0.85;

                    lastVelocity = velocityMetersPerSec;
                }
                lastPos = bestCenter;
            } else {
                currentRealSpeed *= 0.5;
                if(currentRealSpeed < 0.02) currentRealSpeed = 0;
                lastVelocity = 0;
                lastPos = null;
            }

            // 6. 每 0.5 秒平滑刷新一次显示 UI
            if (currentTime - lastDisplayTime >= 500) { 
                speedVal.innerText = currentRealSpeed.toFixed(2);
                accelVal.innerText = currentRealAccel.toFixed(2);
                lastDisplayTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
