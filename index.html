<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金属块实时追踪与加速度计 (m/s²)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 60vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 40vh; padding: 15px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #00ffff; }
        .data-box { font-size: 32px; font-weight: bold; color: #00ffff; margin: 10px 0; }
        .sub-data { font-size: 18px; color: #aaa; margin-bottom: 15px; }
        button { padding: 15px 30px; font-size: 18px; background: #00ffff; color: #000; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,255,255,0.3); }
        .slider-container { margin: 10px auto; width: 80%; display: flex; justify-content: space-between; align-items: center; }
        input[type=range] { width: 65%; }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn">开始追踪金属块</button>
        <div id="controls" style="display:none;">
            <div class="slider-container">
                <label>金属亮度门限:</label>
                <input type="range" id="thresholdSlider" min="50" max="230" value="180">
                <span id="sliderVal">180</span>
            </div>
            <div class="data-box">实时加速度: <span id="accel-val">0.00</span> m/s²</div>
            <div class="sub-data">当前速度: <span id="speed-val">0.00</span> m/s</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const sliderVal = document.getElementById('sliderVal');
        const controls = document.getElementById('controls');

        // --- 【核心物理参数配置】 ---
        // 手机距离物体 20cm 时画面放大：1厘米约为 32 像素，故 1米 = 3200 像素
        const PX_PER_METER = 3200; 
        
        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let isTracking = false;
        let targetThreshold = 180; // 默认调高初始门限，更适合抓取金属反光

        // 0.5秒定时显示缓存
        let currentRealSpeed = 0;
        let currentRealAccel = 0;
        let lastDisplayTime = performance.now();

        thresholdSlider.addEventListener('input', (e) => {
            targetThreshold = parseInt(e.target.value);
            sliderVal.innerText = targetThreshold;
        });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                isTracking = true;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                alert("无法获取相机权限: " + err.message);
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;

            let sumX = 0, sumY = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                // 筛选超过门限的高亮金属区域
                if (gray > targetThreshold) {
                    const pixelIndex = i / 4;
                    sumX += pixelIndex % canvas.width;
                    sumY += Math.floor(pixelIndex / canvas.width);
                    count++;
                }
            }

            const currentTime = performance.now();
            const dt = (currentTime - lastTime) / 1000; // 秒

            // 过滤噪点：确保识别区域大小合理
            if (count > 50 && count < (data.length / 4) * 0.3 && dt > 0) { 
                const currentPos = { x: sumX / count, y: sumY / count };

                // 绘制高亮追踪十字靶心
                ctx.beginPath();
                ctx.arc(currentPos.x, currentPos.y, 15, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(currentPos.x - 20, currentPos.y); ctx.lineTo(currentPos.x + 20, currentPos.y);
                ctx.moveTo(currentPos.x, currentPos.y - 20); ctx.lineTo(currentPos.x, currentPos.y + 20);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (lastPos) {
                    const dx = currentPos.x - lastPos.x;
                    const dy = currentPos.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    // 1. 像素到位移转换（公制单位）
                    const distanceMeters = distancePx / PX_PER_METER;

                    // 2. 物理公式计算速度与加速度
                    const velocityMetersPerSec = distanceMeters / dt;
                    const accelMetersPerSec2 = (velocityMetersPerSec - lastVelocity) / dt;

                    // 3. 一阶低通滤波：抗抖动平滑处理
                    currentRealSpeed = velocityMetersPerSec * 0.25 + currentRealSpeed * 0.75;
                    
                    let rawAccel = Math.abs(accelMetersPerSec2);
                    if (rawAccel < 0.15) rawAccel = 0; // 过滤手持微小抖动的死区
                    currentRealAccel = rawAccel * 0.15 + currentRealAccel * 0.85;

                    lastVelocity = velocityMetersPerSec;
                }
                lastPos = currentPos;
            } else {
                // 失去目标时速度自然衰减
                currentRealSpeed *= 0.4;
                if(currentRealSpeed < 0.02) currentRealSpeed = 0;
                lastVelocity = 0;
            }

            // --- 【核心：每隔 0.5 秒 (500毫秒) 刷新一次前端 UI】 ---
            if (currentTime - lastDisplayTime >= 500) { 
                speedVal.innerText = currentRealSpeed.toFixed(2);
                accelVal.innerText = currentRealAccel.toFixed(2);
                lastDisplayTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
