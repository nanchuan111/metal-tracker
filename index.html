<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时追踪加速度</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 35vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 65vh; padding: 10px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #ff3366; overflow-y: auto; }
        
        #record-console { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #444; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 5px; }
        .btn-action { padding: 10px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; }
        #startRecBtn { background: #ff3366; color: #fff; }
        #stopRecBtn { background: #ffaa00; color: #000; }
        
        #avg-display { font-size: 20px; color: #00f0ff; margin-top: 6px; font-weight: bold; background: #111; padding: 6px; border-radius: 6px; border: 1px solid #00f0ff; }
        #global-avg-display { font-size: 22px; color: #00ff66; margin-top: 4px; font-weight: bold; background: #111; padding: 6px; border-radius: 6px; border: 1px solid #00ff66; }

        #table-panel { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #444; text-align: left; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 6px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #111; font-size: 12px; color: #ccc; min-width: 480px; }
        th, td { padding: 8px; border: 1px solid #333; text-align: center; }
        th { background: #252525; color: #ffaa00; }
        tr:nth-child(even) { background: #181818; }
        .td-raw { text-align: left; font-family: monospace; font-size: 11px; color: #00ff66; word-break: break-all; max-width: 220px; }
        
        .btn-delete-item { background: none; border: none; color: #ff3366; cursor: pointer; font-size: 14px; padding: 2px 6px; }
        .btn-delete-item:hover { transform: scale(1.2); }

        .slider-container { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #ccc; margin: 6px 0; }
        input[type=range] { width: 85%; margin-top: 2px; }
        #chart-container { width: 95%; max-width: 600px; height: 105px; margin: 5px auto; background: #1e1e1e; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading">正在加载...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none; padding: 12px 25px; font-size: 16px; background: #ff3366; color: #fff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;">原神启动</button>
        
        <div id="controls" style="display:none;">
            <div id="record-console">
                <div style="font-size: 13px; color: #ffaa00; font-weight: bold;">⚡ 相机工作帧率: <span id="fps-display">--</span> FPS | 标定长: 30cm</div>
                <div class="btn-group">
                    <button id="startRecBtn" class="btn-action">▶️ 开始捕获数据</button>
                    <button id="stopRecBtn" class="btn-action" style="opacity: 0.4;" disabled>⏹️ 智能检索并结算</button>
                </div>
                <div id="avg-display">📊 当前单次滑行平均 a: <span id="avg-val">--</span> m/s²</div>
                <div id="global-avg-display">🎯 历史累计所有实验总平均 a: <span id="global-avg-val">--</span> m/s²</div>
            </div>

            <div id="table-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size: 13px; color: #ffaa00; font-weight: bold;">📋 物理实验多轮数据统计表</span>
                    <button id="clearBtn" style="padding: 4px 10px; font-size: 11px; font-weight: bold; background: #3a1e24; color: #ff3366; border: 1px solid #ff3366; border-radius: 4px; cursor: pointer;">清空全部表格</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 15%;">序号</th>
                                <th style="width: 50%;">本轮存的a(m/s²)</th>
                                <th style="width: 23%;">本轮平均 a</th>
                                <th style="width: 12%;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td colspan="4" style="color: #666; padding: 15px;">暂无实验数据，等待放手下滑结算...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="slider-container" style="background:#1e1e1e; padding:5px; border-radius:8px; margin-top:8px;">
                <label>背景更新速率 (Learning Rate): <span id="valLR">0.0000</span></label>
                <input type="range" id="lrSlider" min="0" max="100" value="0" style="width:90%;">
            </div>
            
            <div style="font-size: 20px; font-weight: bold; color: #ff3366; margin: 6px 0; background: #222; padding: 4px; border-radius: 5px;">
                瞬时a: <span id="accel-val">0.00</span> m/s²
            </div>

            <div id="chart-container">
                <canvas id="accelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const startBtn = document.getElementById('startBtn');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');

        const startRecBtn = document.getElementById('startRecBtn');
        const stopRecBtn = document.getElementById('stopRecBtn');
        const avgVal = document.getElementById('avg-val');
        const globalAvgVal = document.getElementById('global-avg-val');
        const fpsDisplay = document.getElementById('fps-display');
        const lrSlider = document.getElementById('lrSlider');
        const vLR = document.getElementById('valLR');
        
        const tableBody = document.getElementById('table-body');
        const clearBtn = document.getElementById('clearBtn');

        const REAL_DISTANCE_M = 0.30; 
        const TRACK_PIXELS = 450;     
        const PX_PER_METER = TRACK_PIXELS / REAL_DISTANCE_M; 

        let isTracking = false;
        let learningRate = 0.0000;

        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let currentRealAccel = 0;

        let isRecording = false;
        let recordedAccelData = []; 

        let experimentList = []; 

        let chartInstance;
        let chartLabels = Array(40).fill(''); 
        let chartData = Array(40).fill(0);   
        let lastChartUpdateTime = performance.now();

        let fpsFrameCount = 0;
        let fpsLastTime = performance.now();

        let src, gray, fgmask, bgSubtractor, contours, hierarchy;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        lrSlider.addEventListener('input', () => {
            learningRate = parseFloat(lrSlider.value) / 10000;
            vLR.innerText = learningRate.toFixed(4);
        });

        startRecBtn.addEventListener('click', () => {
            recordedAccelData = []; 
            isRecording = true;
            startRecBtn.style.opacity = "0.4"; startRecBtn.disabled = true;
            stopRecBtn.style.opacity = "1"; stopRecBtn.disabled = false;
            avgVal.innerText = "等待放手";
        });

        stopRecBtn.addEventListener('click', () => {
            isRecording = false;
            startRecBtn.style.opacity = "1"; startRecBtn.disabled = false;
            stopRecBtn.style.opacity = "0.4"; stopRecBtn.disabled = true;

            if (recordedAccelData.length < 5) {
                avgVal.innerText = "--";
                return;
            }

            let motionStartIndex = -1;
            for (let i = 0; i < recordedAccelData.length; i++) {
                if (recordedAccelData[i] > 0.15) {
                    motionStartIndex = i;
                    break;
                }
            }

            if (motionStartIndex === -1) {
                avgVal.innerText = "--";
                return;
            }

            let realDataStart = motionStartIndex + 6;
            let stableSegment = recordedAccelData.slice(realDataStart);

            stableSegment = stableSegment.filter(x => x > 0.1); 
            if (stableSegment.length > 4) {
                stableSegment = stableSegment.slice(0, -2); 
            }

            if (stableSegment.length > 0) {
                let sum = stableSegment.reduce((a, b) => a + b, 0);
                let avg = sum / stableSegment.length;
                
                // 核心修复位置 1：明确赋值单次平均显示，防止被后面覆盖
                avgVal.innerText = avg.toFixed(2);
                
                let formattedRawData = stableSegment.map(v => v.toFixed(2)).join(", ");
                
                const newId = experimentList.length > 0 ? experimentList[experimentList.length - 1].id + 1 : 1;
                experimentList.push({
                    id: newId,
                    dataString: formattedRawData,
                    avgValue: avg
                });

                renderTable(false); // 传入 false 表示不需要把控制台显示清成 "--"

            } else {
                avgVal.innerText = "--";
            }
        });

        // 📊 渲染表格逻辑
        function renderTable(resetCurrentDisplay = true) {
            if (experimentList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="color: #666; padding: 15px;">暂无实验数据，等待放手下滑结算...</td></tr>`;
                globalAvgVal.innerText = "--";
                if (resetCurrentDisplay) avgVal.innerText = "--";
                return;
            }

            let tableHtml = "";
            let globalSum = 0;

            experimentList.forEach((item, index) => {
                globalSum += item.avgValue;
                tableHtml += `
                    <tr>
                        <td>实验 ${index + 1}</td>
                        <td class="td-raw">${item.dataString}</td>
                        <td style="color:#00f0ff; font-weight:bold;">${item.avgValue.toFixed(2)}</td>
                        <td>
                            <button class="btn-delete-item" onclick="deleteItem(${item.id})">❌</button>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = tableHtml;
            
            let globalAvg = globalSum / experimentList.length;
            globalAvgVal.innerText = globalAvg.toFixed(2);
            
            // 核心修复位置 2：如果仅仅是删除了某一项，把当前单次值清空，防止数据错乱
            if (resetCurrentDisplay) {
                avgVal.innerText = "--";
            }
        }

        // 🧼 独立单项删除
        window.deleteItem = function(id) {
            experimentList = experimentList.filter(item => item.id !== id);
            renderTable(true); // 删除单项时重置当前单次框为 "--"
        };

        // 一键清空
        clearBtn.addEventListener('click', () => {
            experimentList = [];
            renderTable(true);
        });

        function initChart() {
            const chartCtx = document.getElementById('accelChart').getContext('2d');
            chartInstance = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: '瞬时加速度 (m/s²)',
                        data: chartData,
                        borderColor: '#ff3366',
                        borderWidth: 2,
                        pointRadius: 1, 
                        fill: true,
                        backgroundColor: 'rgba(255, 51, 102, 0.04)',
                        tension: 0 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 12, grid: { color: '#333' }, ticks: { color: '#aaa' } }, 
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },  
                        height: { ideal: 480 },
                        frameRate: { min: 60, ideal: 240 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                initChart(); 

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    fgmask = new cv.Mat();
                    contours = new cv.MatVector();
                    hierarchy = new cv.Mat();

                    bgSubtractor = new cv.BackgroundSubtractorMOG2(500, 16, false);

                    isTracking = true;
                    lastTime = performance.now();
                    fpsLastTime = performance.now();
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                    video.srcObject = fallbackStream;
                    startBtn.style.display = 'none'; controls.style.display = 'block'; initChart();
                } catch(e) { alert("相机启动失败。"); }
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            fpsFrameCount++;
            const nowTime = performance.now();
            if (nowTime - fpsLastTime >= 1000) {
                fpsDisplay.innerText = fpsFrameCount;
                fpsFrameCount = 0;
                fpsLastTime = nowTime;
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            bgSubtractor.apply(gray, fgmask, learningRate);

            cv.findContours(fgmask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let bestCenter = null;
            let maxArea = 0;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                if (area > 50 && area < 20000) {
                    if (area > maxArea) {
                        maxArea = area;
                        let M = cv.moments(cnt, false);
                        if (M.m00 !== 0) {
                            bestCenter = { x: M.m10 / M.m00, y: M.m01 / M.m00 };
                        }
                    }
                }
            }

            cv.imshow('canvas', fgmask);

            const currentTime = performance.now();
            const realDt = (currentTime - lastTime) / 1000;

            if (bestCenter && realDt > 0) {
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 16, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (lastPos) {
                    const dx = bestCenter.x - lastPos.x;
                    const dy = bestCenter.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    let currentRealSpeed = distancePx / PX_PER_METER / realDt;
                    let rawAccel = Math.abs((currentRealSpeed - lastVelocity) / realDt);

                    if (rawAccel > 10.0) {
                        rawAccel = 0.0;
                    }

                    currentRealAccel = rawAccel;
                    
                    if (isRecording) {
                        recordedAccelData.push(currentRealAccel);
                    }

                    lastVelocity = currentRealSpeed;
                }
                lastPos = { x: bestCenter.x, y: bestCenter.y };
            } else {
                currentRealAccel = 0;
                lastVelocity = 0;
                lastPos = null;
                if (isRecording) {
                    recordedAccelData.push(0.0);
                }
            }

            accelVal.innerText = currentRealAccel.toFixed(2);

            if (currentTime - lastChartUpdateTime >= 30) {
                chartData.push(parseFloat(currentRealAccel.toFixed(2))); 
                chartData.shift(); 
                if (chartInstance) {
                    chartInstance.update('none'); 
                }
                lastChartUpdateTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
