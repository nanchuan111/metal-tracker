<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板快照锁定追踪器 v9.0</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 40vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 60vh; padding: 10px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #ffcc00; overflow-y: auto; }
        .data-row { display: flex; justify-content: space-around; margin: 5px 0; align-items: center; }
        .data-box { font-size: 24px; font-weight: bold; color: #ffcc00; }
        .sub-data { font-size: 16px; color: #aaa; }
        button { padding: 12px 25px; font-size: 16px; background: #ffcc00; color: #000; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        #chart-container { width: 95%; max-width: 600px; height: 180px; margin: 10px auto; background: #1e1e1e; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
        .engine-tag { font-size: 12px; color: #000; background: #ffcc00; padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; font-weight: bold; }
        #guide-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 2px dashed #ffcc00; box-sizing: border-box; pointer-events: none; display: none; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading">正在加载全新模板匹配引擎，请稍候...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="guide-overlay"></div>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none;">启动相机并对准</button>
        <button id="lockBtn" style="display:none; background: #00ffff; color: #000;">对准方块：点击锁定特征并追踪</button>
        
        <div id="controls" style="display:none;">
            <div class="data-row">
                <div class="data-box">加速度: <span id="accel-val">0.00</span> m/s²</div>
                <div class="sub-data" style="line-height: 35px;">速度: <span id="speed-val">0.00</span> m/s</div>
            </div>
            <div class="data-row" style="margin-top: -5px;">
                <span class="engine-tag">首帧快照滑窗卷积匹配机制已启用</span>
                <span class="sub-data" style="color: #ffcc00; font-weight: bold;">无视图像破损 | 240FPS自适应裸数据</span>
            </div>

            <div id="chart-container">
                <canvas id="accelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const lockBtn = document.getElementById('lockBtn');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');
        const guideOverlay = document.getElementById('guide-overlay');

        const PX_PER_METER = 3200; 
        const TEMPLATE_SIZE = 60; // 匹配方块区域大小（像素）
        
        let isTracking = false;
        let isTemplateInitialized = false;

        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let currentRealSpeed = 0;
        let currentRealAccel = 0;

        let chartInstance;
        let chartLabels = Array(40).fill(''); 
        let chartData = Array(40).fill(0);   
        let lastChartUpdateTime = performance.now();

        // OpenCV 核心矩阵变量
        let src, gray, template, result;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        function initChart() {
            const chartCtx = document.getElementById('accelChart').getContext('2d');
            chartInstance = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: '裸数据加速度 (m/s²)',
                        data: chartData,
                        borderColor: '#ffcc00',
                        borderWidth: 2,
                        pointRadius: 1, 
                        fill: true,
                        backgroundColor: 'rgba(255, 204, 0, 0.04)',
                        tension: 0 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 25, grid: { color: '#333' }, ticks: { color: '#aaa' } },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 240 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                lockBtn.style.display = 'inline-block';
                guideOverlay.style.display = 'block'; // 显示屏幕中央引导虚线框

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    template = new cv.Mat();
                    result = new cv.Mat();
                    
                    isTracking = true;
                    requestAnimationFrame(preTrackLoop);
                };
            } catch (err) {
                alert("相机权限获取失败: " + err.message);
            }
        });

        // 在未锁定特征前，仅仅做画面预览投喂，并绘制引导框
        function preTrackLoop() {
            if (isTemplateInitialized || !isTracking) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(preTrackLoop);
        }

        // 按钮触发核心：截取正中心的正方形图像作为工业硬模板
        lockBtn.addEventListener('click', () => {
            // 计算屏幕正中心的 ROI（感兴趣区域）坐标
            let startX = Math.floor((canvas.width - TEMPLATE_SIZE) / 2);
            let startY = Math.floor((canvas.height - TEMPLATE_SIZE) / 2);

            // 读取当前帧灰度图
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            // 截取核心方块特征矩形
            let rect = new cv.Rect(startX, startY, TEMPLATE_SIZE, TEMPLATE_SIZE);
            template = gray.roi(rect).clone(); // 克隆为标准模板

            guideOverlay.style.display = 'none';
            lockBtn.style.display = 'none';
            controls.style.display = 'block';
            initChart();

            isTemplateInitialized = true;
            lastTime = performance.now();
            requestAnimationFrame(trackLoop);
        });

        function trackLoop() {
            if (!isTracking || !isTemplateInitialized) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            // 1. 全图转为灰度基准图
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            // 2. 核心大招：执行滑窗模板匹配 (使用归一化相关系数匹配法，抗光影极强)
            cv.matchTemplate(gray, template, result, cv.TM_CCOEFF_NORMED);

            // 3. 找出重合度最高（最像方块）的那个点的位置坐标
            let minMax = cv.minMaxLoc(result);
            let maxLoc = minMax.maxLoc; // 匹配度最高的左上角点

            // 4. 计算当前方块在画面中的中心点坐标
            let bestCenter = {
                x: maxLoc.x + TEMPLATE_SIZE / 2,
                y: maxLoc.y + TEMPLATE_SIZE / 2
            };

            const currentTime = performance.now();
            const dt = (currentTime - lastTime) / 1000;

            // 无任何形状干扰卡锁，直接输出纯净位置漂移
            if (bestCenter && dt > 0) {
                // 绘制金黄色工业级锁定十字线与核心靶圈
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 20, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(bestCenter.x - 30, bestCenter.y); ctx.lineTo(bestCenter.x + 30, bestCenter.y);
                ctx.moveTo(bestCenter.x, bestCenter.y - 30); ctx.lineTo(bestCenter.x, bestCenter.y + 30);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (lastPos) {
                    const dx = bestCenter.x - lastPos.x;
                    const dy = bestCenter.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    currentRealSpeed = distancePx / PX_PER_METER / dt;
                    let rawAccel = Math.abs((currentRealSpeed - lastVelocity) / dt);

                    if (rawAccel > 100.0) rawAccel = 0.0;

                    currentRealAccel = rawAccel;
                    lastVelocity = currentRealSpeed;
                }
                lastPos = { x: bestCenter.x, y: bestCenter.y };
            }

            // 数据直出 UI
            speedVal.innerText = currentRealSpeed.toFixed(2);
            accelVal.innerText = currentRealAccel.toFixed(2);

            // 图表更新
            if (currentTime - lastChartUpdateTime >= 50) {
                chartData.push(parseFloat(currentRealAccel.toFixed(2))); 
                chartData.shift(); 
                if (chartInstance) {
                    chartInstance.update('none'); 
                }
                lastChartUpdateTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
