<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度追踪与实时加速度图表 v5.2 (裸数据直出版)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 40vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 60vh; padding: 10px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #00ffff; overflow-y: auto; }
        .data-row { display: flex; justify-content: space-around; margin: 5px 0; align-items: center; }
        .data-box { font-size: 24px; font-weight: bold; color: #00ffff; }
        .sub-data { font-size: 16px; color: #aaa; }
        button { padding: 10px 20px; font-size: 16px; background: #00ffff; color: #000; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        .slider-container { margin: 5px auto; width: 90%; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        input[type=range] { width: 60%; }
        #chart-container { width: 95%; max-width: 600px; height: 180px; margin: 10px auto; background: #1e1e1e; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
        .engine-tag { font-size: 12px; color: #ffcc00; background: rgba(255,204,0,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; font-weight: bold; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading">正在加载 OpenCV.js 视觉引擎，请稍候...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none;">开始高精度追踪</button>
        <div id="controls" style="display:none;">
            <div class="slider-container">
                <label>边缘检测门限:</label>
                <input type="range" id="thresholdSlider" min="10" max="180" value="70">
                <span id="sliderVal">70</span>
            </div>
            
            <div class="data-row">
                <div class="data-box">加速度: <span id="accel-val">0.00</span> m/s²</div>
                <div class="sub-data" style="line-height: 35px;">速度: <span id="speed-val">0.00</span> m/s</div>
            </div>
            <div class="data-row" style="margin-top: -5px;">
                <span class="engine-tag">⚠️ 突变过滤已完全关闭 | 原始波形直出</span>
                <span class="sub-data" style="color: #00ffff; font-weight: bold;">0.1秒高频结算</span>
            </div>

            <div id="chart-container">
                <canvas id="accelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const sliderVal = document.getElementById('sliderVal');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');

        // --- 【核心物理校准：20cm 距离配置】 ---
        const PX_PER_METER = 3200; 
        
        let isTracking = false;
        let cannyThreshold = 70; 

        // 时间与结算控制
        let lastCalcTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let currentRealSpeed = 0;
        let currentRealAccel = 0;

        // Chart.js 图像变量 (保持30点高频流动)
        let chartInstance;
        let chartLabels = Array(30).fill(''); 
        let chartData = Array(30).fill(0);   

        // OpenCV 内存对象
        let src, gray, blurred, edges, contours, hierarchy;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        // 初始化图表
        function initChart() {
            const chartCtx = document.getElementById('accelChart').getContext('2d');
            chartInstance = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: '实时原始加速度 (m/s²)',
                        data: chartData,
                        borderColor: '#ffaa00', // 更改为橙色，提示当前为无过滤的裸数据
                        borderWidth: 2,
                        pointRadius: 2, // 开启数据点圆圈，方便观察每一个突变点
                        fill: true,
                        backgroundColor: 'rgba(255, 170, 0, 0.05)',
                        tension: 0 // 关闭曲线张力，使用折线纯实反映跳变
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: 25, // 裸数据波动较大，适度调高图表上限视野
                            grid: { color: '#333' },
                            ticks: { color: '#aaa' }
                        },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        thresholdSlider.addEventListener('input', (e) => {
            cannyThreshold = parseInt(e.target.value);
            sliderVal.innerText = cannyThreshold;
        });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                initChart(); 

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    blurred = new cv.Mat();
                    edges = new cv.Mat();
                    contours = new cv.MatVector();
                    hierarchy = new cv.Mat();
                    isTracking = true;
                    lastCalcTime = performance.now();
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                alert("无法获取相机权限: " + err.message);
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            cv.Canny(blurred, edges, cannyThreshold, cannyThreshold * 2);
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let bestCenter = null;
            let maxArea = 0;

            // 宽容面积核心过滤
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                if (area > 100 && area < 6500) {
                    if (area > maxArea) {
                        maxArea = area;
                        let M = cv.moments(cnt, false);
                        if (M.m00 !== 0) {
                            bestCenter = { x: M.m10 / M.m00, y: M.m01 / M.m00 };
                        }
                    }
                }
            }

            // 实时绘制十字追踪准星
            if (bestCenter) {
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 18, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            const currentTime = performance.now();
            const dt = (currentTime - lastCalcTime) / 1000;

            // --- 【严格锁死 0.1 秒无过滤计算】 ---
            if (dt >= 0.100) { 
                if (bestCenter) {
                    if (lastPos) {
                        const dx = bestCenter.x - lastPos.x;
                        const dy = bestCenter.y - lastPos.y;
                        const distancePx = Math.sqrt(dx * dx + dy * dy);

                        // 1. 裸速度解算
                        currentRealSpeed = distancePx / PX_PER_METER / dt;
                        
                        // 2. 裸加速度解算（完全移除突变判定和历史均值替代）
                        let rawAccel = Math.abs((currentRealSpeed - lastVelocity) / dt);

                        // 3. 底层强行熔断归零保护
                        if (rawAccel > 100.0) {
                            rawAccel = 0.0;
                        }

                        currentRealAccel = rawAccel; 
                        lastVelocity = currentRealSpeed;
                    }
                    lastPos = { x: bestCenter.x, y: bestCenter.y };
                } else {
                    currentRealSpeed = 0;
                    currentRealAccel = 0;
                    lastVelocity = 0;
                    lastPos = null;
                }

                // 4. 数据毫无保留直出 UI 
                speedVal.innerText = currentRealSpeed.toFixed(2);
                accelVal.innerText = currentRealAccel.toFixed(2);

                // 5. 数据直出折线图（关闭张力平滑，展示最真实的物理锯齿）
                chartData.push(parseFloat(currentRealAccel.toFixed(2))); 
                chartData.shift(); 
                if (chartInstance) {
                    chartInstance.update('none'); 
                }

                lastCalcTime = currentTime;
            }

            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
