<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保温箱专属：正方形金属高精度追踪系统 v3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 40vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 60vh; padding: 10px; box-sizing: border-box; background: #2a2a2a; border-top: 3px solid #00ffff; overflow-y: auto; }
        .data-row { display: flex; justify-content: space-around; margin: 5px 0; align-items: center; }
        .data-box { font-size: 24px; font-weight: bold; color: #00ffff; }
        .sub-data { font-size: 16px; color: #aaa; }
        button { padding: 10px 20px; font-size: 16px; background: #00ffff; color: #000; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        .slider-container { margin: 5px auto; width: 90%; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        input[type=range] { width: 60%; }
        #chart-container { width: 95%; max-width: 600px; height: 190px; margin: 10px auto; background: #1e1e1e; border-radius: 8px; padding: 5px; border: 1px solid #444; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
        .engine-tag { font-size: 12px; color: #00ffcc; background: rgba(0,255,204,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading">正在加载 OpenCV.js 视觉引擎，请稍候...</div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none;">开始高精度追踪</button>
        <div id="controls" style="display:none;">
            <div class="slider-container">
                <label>边缘检测门限:</label>
                <input type="range" id="thresholdSlider" min="20" max="250" value="210">
                <span id="sliderVal">210</span>
            </div>
            
            <div class="data-row">
                <div class="data-box">
                    实时加速度: <span id="accel-val">0.00</span> m/s²
                    <span class="engine-tag">突变滤除已启用 | ＞100归零</span>
                </div>
            </div>
            <div class="data-row">
                <div class="sub-data">当前速度: <span id="speed-val">0.00</span> m/s</div>
                <div class="sub-data" style="color: #ffcc00; font-weight: bold;">物理校准: 距离10cm</div>
            </div>

            <div id="chart-container">
                <canvas id="accelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const sliderVal = document.getElementById('sliderVal');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');

        // --- 【核心物理校准：10cm近距离配置】 ---
        // 距离缩短为10cm：1厘米在镜头中约为64像素，因此 1米 = 6400 像素
        const PX_PER_METER = 6400; 
        
        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let isTracking = false;
        let cannyThreshold = 210;

        // 0.3秒定时刷新缓存
        let currentRealSpeed = 0;
        let currentRealAccel = 0;
        let lastDisplayTime = performance.now();

        // --- 【异常数据舍弃与滤波机制】 ---
        let recentAccels = []; 
        const MAX_HISTORY = 5;  
        const ERROR_THRESHOLD = 12.0; // 单帧如果与附近均值偏差大于 12 m/s²，判定为反光假噪点，直接滤除

        // Chart.js 图像相关变量
        let chartInstance;
        // 保持 25 个时间点的数据宽度（时间从左向右流动）
        let chartLabels = Array(25).fill(''); 
        let chartData = Array(25).fill(0);   

        // OpenCV 内存容器
        let src, gray, blurred, edges, contours, hierarchy, approx;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        // --- 【核心修改：构建带有熔断红线的“加速度-时间”图表】 ---
        function initChart() {
            const chartCtx = document.getElementById('accelChart').getContext('2d');
            chartInstance = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: '实时加速度 (m/s²)',
                            data: chartData,
                            borderColor: '#00ffff',
                            borderWidth: 2.5,
                            pointRadius: 0, 
                            fill: true,
                            backgroundColor: 'rgba(0, 255, 255, 0.05)',
                            tension: 0.2,
                            z: 1
                        },
                        {
                            label: '100m/s² 归零红线',
                            data: Array(25).fill(100), // 画一条水平的硬性红线
                            borderColor: '#ff3333',
                            borderWidth: 1.5,
                            borderDash: [5, 5], // 虚线效果
                            pointRadius: 0,
                            fill: false,
                            z: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: 120, // 量程设为120，完美展现100的位置
                            grid: { color: '#333' },
                            ticks: { 
                                color: '#aaa',
                                callback: function(value) {
                                    if(value === 100) return '100 (上限归零)';
                                    return value;
                                }
                            }
                        },
                        x: { 
                            display: true,
                            grid: { display: false },
                            title: { display: true, text: '时间推进 → (0.3秒/点)', color: '#666', font: { size: 10 } }
                        }
                    },
                    plugins: { 
                        legend: { display: false } // 隐藏顶部图例
                    }
                }
            });
        }

        thresholdSlider.addEventListener('input', (e) => {
            cannyThreshold = parseInt(e.target.value);
            sliderVal.innerText = cannyThreshold;
        });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                
                initChart(); // 初始化生成图像

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    blurred = new cv.Mat();
                    edges = new cv.Mat();
                    contours = new cv.MatVector();
                    hierarchy = new cv.Mat();
                    approx = new cv.Mat();
                    
                    isTracking = true;
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                alert("无法获取相机权限: " + err.message);
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            // OpenCV 核心专属管道：灰度化 -> 高斯消反光 -> Canny边缘 -> 寻找轮廓
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blurred, new cv.Size(7, 7), 0, 0, cv.BORDER_DEFAULT);
            cv.Canny(blurred, edges, cannyThreshold, cannyThreshold * 1.5);
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let bestCenter = null;
            let maxArea = 0;

            // 专属模式：仅识别具有正方形特征的几何轮廓
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                
                // 10cm距离下，正方形的像素面积通常在 1000 ~ 25000 之间
                if (area > 1000 && area < 25000) {
                    let perimeter = cv.arcLength(cnt, true);
                    cv.approxPolyDP(cnt, approx, 0.04 * perimeter, true);
                    
                    // 几何约束：必须是凸四边形
                    if (approx.rows === 4 && cv.isContourConvex(approx)) {
                        let rect = cv.boundingRect(cnt);
                        let rectArea = rect.width * rect.height;
                        let solidity = area / rectArea;
                        
                        // 饱满度过滤：只追踪高方正度的方块金属，忽略长条形和圆形反光
                        if (solidity > 0.82) {
                            if (area > maxArea) {
                                maxArea = area;
                                let M = cv.moments(cnt, false);
                                if (M.m00 !== 0) {
                                    bestCenter = { x: M.m10 / M.m00, y: M.m01 / M.m00 };
                                }
                            }
                        }
                    }
                }
            }

            const currentTime = performance.now();
            const dt = (currentTime - lastTime) / 1000;

            if (bestCenter && dt > 0) {
                // 在实时画面上绘制高科技青色追踪靶
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 24, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (lastPos) {
                    const dx = bestCenter.x - lastPos.x;
                    const dy = bestCenter.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    const distanceMeters = distancePx / PX_PER_METER;
                    const velocityMetersPerSec = distanceMeters / dt;
                    let accelMetersPerSec2 = (velocityMetersPerSec - lastVelocity) / dt;
                    let rawAccel = Math.abs(accelMetersPerSec2);

                    // --- 【核心逻辑①：舍弃突变偏差过大的噪音数值】 ---
                    let avgAccel = recentAccels.length > 0 ? recentAccels.reduce((a, b) => a + b, 0) / recentAccels.length : 0;
                    if (recentAccels.length >= MAX_HISTORY && Math.abs(rawAccel - avgAccel) > ERROR_THRESHOLD) {
                        rawAccel = avgAccel; // 属于异常跳变，强制舍弃，沿用稳定均值
                    } else {
                        recentAccels.push(rawAccel);
                        if (recentAccels.length > MAX_HISTORY) recentAccels.shift();
                    }

                    // --- 【核心逻辑②：上限不超过 100 m/s²，否则强制归零】 ---
                    if (rawAccel > 100.0) {
                        rawAccel = 0.0; // 熔断归零
                    }

                    if (rawAccel < 0.2) rawAccel = 0; // 极其微小的手抖死区过滤

                    // 物理参数一阶滤波平滑
                    currentRealSpeed = velocityMetersPerSec * 0.25 + currentRealSpeed * 0.75;
                    currentRealAccel = rawAccel * 0.2 + currentRealAccel * 0.8;

                    lastVelocity = velocityMetersPerSec;
                }
                lastPos = bestCenter;
            } else {
                currentRealSpeed *= 0.5;
                if(currentRealSpeed < 0.02) currentRealSpeed = 0;
                lastVelocity = 0;
                lastPos = null;
            }

            // --- 【核心修改③：每 0.3 秒在随时间流动的图像中打入一个点】 ---
            if (currentTime - lastDisplayTime >= 300) { 
                accelVal.innerText = currentRealAccel.toFixed(2);
                speedVal.innerText = currentRealSpeed.toFixed(2);

                // 将最新处理好的加速度数值压入时间轴数组中
                chartData.push(parseFloat(currentRealAccel.toFixed(2))); 
                chartData.shift(); // 弹出最旧的数据，保持时间轴连续向前流动
                
                if (chartInstance) {
                    chartInstance.update('none'); // 高效率无动画刷新折线图
                }

                lastDisplayTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
