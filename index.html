<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #121212; color: #fff; text-align: center; }
        #container { position: relative; width: 100vw; height: 40vh; max-width: 640px; margin: 0 auto; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #dashboard { height: 60vh; padding: 10px; box-sizing: border-box; background: #1e1e1e; border-top: 3px solid #ff3366; overflow-y: auto; }
        .data-row { display: flex; justify-content: space-around; margin: 5px 0; align-items: center; }
        .data-box { font-size: 24px; font-weight: bold; color: #ff3366; }
        .sub-data { font-size: 16px; color: #aaa; }
        button { padding: 12px 25px; font-size: 16px; background: #ff3366; color: #fff; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; margin: 5px; box-shadow: 0 4px 10px rgba(255,51,102,0.3); }
        .slider-container { margin: 8px auto; width: 90%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; background: #252525; padding: 6px 12px; border-radius: 8px; }
        input[type=range] { width: 60%; }
        #chart-container { width: 95%; max-width: 600px; height: 150px; margin: 10px auto; background: #151515; border-radius: 8px; padding: 5px; border: 1px solid #333; }
        #loading { color: #ffcc00; font-weight: bold; margin: 10px; }
        .engine-tag { font-size: 12px; color: #fff; background: #ff3366; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading"></div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="dashboard">
        <button id="startBtn" style="display:none;">启动高斯背景建模追踪</button>
        
        <div id="controls" style="display:none;">
            <div class="slider-container">
                <label>背景学习速率:</label>
                <input type="range" id="learningRateSlider" min="0" max="100" value="0">
                <span id="lrVal">0.000</span>
            </div>
            
            <div class="data-row">
                <div class="data-box">加速度: <span id="accel-val">0.00</span> m/s²</div>
                <div class="sub-data" style="line-height: 35px;">速度: <span id="speed-val">0.00</span> m/s</div>
            </div>
            <div class="data-row" style="margin-top: -5px;">
                <span class="engine-tag">MOG2 静态环境主动智能剔除已激活</span>
                <span class="sub-data" style="color: #00ffff; font-weight: bold;">无视物理形变与漫反射抖动</span>
            </div>

            <div id="chart-container">
                <canvas id="accelChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const accelVal = document.getElementById('accel-val');
        const speedVal = document.getElementById('speed-val');
        const startBtn = document.getElementById('startBtn');
        const controls = document.getElementById('controls');
        const loadingText = document.getElementById('loading');
        const lrSlider = document.getElementById('learningRateSlider');
        const lrVal = document.getElementById('lrVal');

        const PX_PER_METER = 3200; 
        let isTracking = false;
        let learningRate = 0.000; // 默认静止背景不刷新

        let lastTime = performance.now();
        let lastPos = null;
        let lastVelocity = 0;
        let currentRealSpeed = 0;
        let currentRealAccel = 0;

        let chartInstance;
        let chartLabels = Array(40).fill(''); 
        let chartData = Array(40).fill(0);   
        let lastChartUpdateTime = performance.now();

        // OpenCV 高阶对象内存分配
        let src, gray, fgmask, bgSubtractor, contours, hierarchy;

        function onOpenCvReady() {
            loadingText.style.display = 'none';
            startBtn.style.display = 'inline-block';
        }

        lrSlider.addEventListener('input', (e) => {
            // 将0-100转换为0到0.01的微调速率
            learningRate = parseFloat(e.target.value) / 10000;
            lrVal.innerText = learningRate.toFixed(4);
        });

        function initChart() {
            const chartCtx = document.getElementById('accelChart').getContext('2d');
            chartInstance = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: '纯净运动运动加速度 (m/s²)',
                        data: chartData,
                        borderColor: '#ff3366',
                        borderWidth: 2,
                        pointRadius: 1, 
                        fill: true,
                        backgroundColor: 'rgba(255, 51, 102, 0.04)',
                        tension: 0 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 25, grid: { color: '#2a2a2a' }, ticks: { color: '#888' } },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 240 } },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                controls.style.display = 'block';
                initChart(); 

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
                    gray = new cv.Mat();
                    fgmask = new cv.Mat();
                    contours = new cv.MatVector();
                    hierarchy = new cv.Mat();

                    // 【核心科技】：初始化工业级混合高斯背景建模器
                    // 历史帧设为500，阈值16，不检测阴影以获得最高速高频响应
                    bgSubtractor = new cv.BackgroundSubtractorMOG2(500, 16, false);

                    isTracking = true;
                    lastTime = performance.now();
                    requestAnimationFrame(trackLoop);
                };
            } catch (err) {
                alert("高帧率实验相机激活失败: " + err.message);
            }
        });

        function trackLoop() {
            if (!isTracking) return;

            // 绘制当前真实场景底图
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            // 1. 转为标准处理空间
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            // 2. 【核心大招】：背景减除。静态的电脑、鼠标、滑道直接在fgmask里化为乌有（全黑）
            // 只有动起来的铝块会变成一团纯白的白斑
            bgSubtractor.apply(gray, fgmask, learningRate);

            // 3. 对剥离出的绝对运动像素区域提取轮廓
            cv.findContours(fgmask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let bestCenter = null;
            let maxArea = 0;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                
                // 排除由于相机画面微弱噪声带来的极小噪点块
                if (area > 40 && area < 20000) {
                    if (area > maxArea) {
                        maxArea = area;
                        let M = cv.moments(cnt, false);
                        if (M.m00 !== 0) {
                            bestCenter = { x: M.m10 / M.m00, y: M.m01 / M.m00 };
                        }
                    }
                }
            }

            const currentTime = performance.now();
            const dt = (currentTime - lastTime) / 1000;

            // 240FPS 无延迟物理数据结算
            if (bestCenter && dt > 0) {
                // 绘制高亮粉色追踪环
                ctx.beginPath();
                ctx.arc(bestCenter.x, bestCenter.y, 18, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (lastPos) {
                    const dx = bestCenter.x - lastPos.x;
                    const dy = bestCenter.y - lastPos.y;
                    const distancePx = Math.sqrt(dx * dx + dy * dy);

                    currentRealSpeed = distancePx / PX_PER_METER / dt;
                    let rawAccel = Math.abs((currentRealSpeed - lastVelocity) / dt);

                    // 100.0 安全抗震熔断机制
                    if (rawAccel > 100.0) rawAccel = 0.0;

                    currentRealAccel = rawAccel;
                    lastVelocity = currentRealSpeed;
                }
                lastPos = { x: bestCenter.x, y: bestCenter.y };
            } else {
                currentRealSpeed = 0;
                currentRealAccel = 0;
                lastVelocity = 0;
                lastPos = null;
            }

            // 直出数据
            speedVal.innerText = currentRealSpeed.toFixed(2);
            accelVal.innerText = currentRealAccel.toFixed(2);

            // 高敏动态图表
            if (currentTime - lastChartUpdateTime >= 50) {
                chartData.push(parseFloat(currentRealAccel.toFixed(2))); 
                chartData.shift(); 
                if (chartInstance) {
                    chartInstance.update('none'); 
                }
                lastChartUpdateTime = currentTime;
            }

            lastTime = currentTime;
            requestAnimationFrame(trackLoop);
        }
    </script>
</body>
</html>
